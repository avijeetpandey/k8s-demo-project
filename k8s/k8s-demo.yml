---
# 1. Database Credentials Secret
apiVersion: v1
kind: Secret
metadata:
  name: k8s-db-secret
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: k8s

---
# 2. Persistent Volume for Postgres
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: k8s-db-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
# 3. PostgreSQL Deployment & Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-db-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-db
  template:
    metadata:
      labels:
        app: k8s-db
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: k8s-db-secret
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: k8s-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-db-service # This exactly matches the DB_HOST environment variable we will inject
spec:
  selector:
    app: k8s-db
  ports:
    - port: 5432
      targetPort: 5432

---
# 4. Spring Boot App Deployment & Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-demo-app-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-demo-app
  template:
    metadata:
      labels:
        app: k8s-demo-app
    spec:
      containers:
        - name: k8s-demo-app
          image: k8s-demo-project:0.0.1
          imagePullPolicy: Never # Forces Minikube to use the locally built image
          ports:
            - containerPort: 9000
          env:
            - name: DB_HOST
              value: k8s-db-service # Points to the database service created above
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: k8s-db-secret
                  key: POSTGRES_DB
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: k8s-db-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: k8s-db-secret
                  key: POSTGRES_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-demo-app-service
spec:
  type: NodePort # Allows local browser access via Minikube tunnel
  selector:
    app: k8s-demo-app
  ports:
    - port: 9000
      targetPort: 9000